<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Arquitetura do laboratório Loja Lab</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#5d6778">Tudo roda na máquina da equipe (localhost). Nenhum sistema externo é acessado.</text>

  <!-- máquina da equipe -->
  <rect x="20" y="80" width="960" height="420" rx="16" fill="#f3f5f9" stroke="#c9d1dc" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#5d6778">MÁQUINA DA EQUIPE (127.0.0.1)</text>

  <!-- navegador -->
  <rect x="50" y="170" width="170" height="110" rx="12" fill="#fff" stroke="#14213d" stroke-width="2"/>
  <text x="135" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#14213d">Navegador</text>
  <text x="135" y="232" text-anchor="middle" font-size="13" fill="#5d6778">HTML · CSS · JS</text>
  <text x="135" y="252" text-anchor="middle" font-size="13" fill="#5d6778">DevTools (F12)</text>

  <!-- curl -->
  <rect x="50" y="330" width="170" height="80" rx="12" fill="#fff" stroke="#14213d" stroke-width="2"/>
  <text x="135" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#14213d">curl</text>
  <text x="135" y="387" text-anchor="middle" font-size="13" fill="#5d6778">requisições diretas</text>

  <!-- burp -->
  <rect x="290" y="170" width="170" height="110" rx="12" fill="#fff4ea" stroke="#ff7a1a" stroke-width="2"/>
  <text x="375" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#14213d">Burp Suite</text>
  <text x="375" y="232" text-anchor="middle" font-size="13" fill="#5d6778">proxy :8080</text>
  <text x="375" y="252" text-anchor="middle" font-size="13" fill="#5d6778">intercepta e altera</text>

  <!-- docker -->
  <rect x="540" y="120" width="420" height="350" rx="14" fill="#eaf2fd" stroke="#2d5aa3" stroke-width="2"/>
  <text x="560" y="148" font-size="14" font-weight="700" fill="#2d5aa3">DOCKER</text>

  <rect x="570" y="165" width="360" height="150" rx="12" fill="#fff" stroke="#2d5aa3" stroke-width="2"/>
  <text x="750" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#14213d">web · PHP 8.3 + Apache (:8000)</text>
  <rect x="590" y="208" width="155" height="90" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="667" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">/vulneravel</text>
  <text x="667" y="262" text-anchor="middle" font-size="12" fill="#5d6778">falhas C1 a C4</text>
  <rect x="757" y="208" width="155" height="90" rx="10" fill="#e6f6ec" stroke="#1b7f3e" stroke-width="2"/>
  <text x="834" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#1b7f3e">/segura</text>
  <text x="834" y="262" text-anchor="middle" font-size="12" fill="#5d6778">correções</text>

  <rect x="570" y="355" width="360" height="95" rx="12" fill="#fff" stroke="#2d5aa3" stroke-width="2"/>
  <text x="750" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#14213d">db · MySQL 8.0</text>
  <text x="667" y="418" text-anchor="middle" font-size="13" fill="#c62828">loja_vulneravel</text>
  <text x="834" y="418" text-anchor="middle" font-size="13" fill="#1b7f3e">loja_segura</text>

  <!-- setas -->
  <defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#14213d"/></marker></defs>
  <line x1="220" y1="225" x2="286" y2="225" stroke="#14213d" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="460" y1="225" x2="566" y2="225" stroke="#14213d" stroke-width="2.5" marker-end="url(#s)"/>
  <path d="M220 370 H500 V285 H566" fill="none" stroke="#14213d" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="667" y1="298" x2="667" y2="351" stroke="#c62828" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="834" y1="298" x2="834" y2="351" stroke="#1b7f3e" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="485" y="214" text-anchor="middle" font-size="12" fill="#5d6778">HTTP</text>

  <!-- fronteira de confiança -->
  <line x1="510" y1="100" x2="510" y2="490" stroke="#c62828" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="500" y="486" text-anchor="end" font-size="12" font-weight="700" fill="#c62828">controlado pelo usuário</text>
  <text x="520" y="486" font-size="12" font-weight="700" fill="#1b7f3e">controlado pela loja</text>
</svg>
